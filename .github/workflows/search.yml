name: Daily Opportunity Search

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch: {}

permissions:
  contents: read
  actions: write

jobs:
  search:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Install dependencies
        run: uv sync

      - name: Run search agent
        id: search
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
        run: |
          uv run python -m agents.search.agent 2> >(tee search_stderr.log >&2)
          # Accept only a well-formed id list; scraped text echoed to stderr cannot inject here.
          ids=$(grep -E '^NEW_OPPORTUNITY_IDS=[0-9a-f,-]*$' search_stderr.log | tail -n 1 || true)
          echo "${ids:-NEW_OPPORTUNITY_IDS=}" >> "$GITHUB_OUTPUT"

      - name: Dispatch match.yml for new opportunities
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPP_IDS: ${{ steps.search.outputs.NEW_OPPORTUNITY_IDS }}
        run: |
          uv run python -m agents.orchestrator --opp-ids "$OPP_IDS"
